services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ag47_radar}
      POSTGRES_USER: ${POSTGRES_USER:-ag47}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ag47_local_only}
    ports:
      - '5432:5432'
    volumes:
      - radar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      APP_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      PROVIDER_MODE: ${PROVIDER_MODE:-demo}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ag47}:${POSTGRES_PASSWORD:-ag47_local_only}@db:5432/${POSTGRES_DB:-ag47_radar}
      CORS_ORIGINS: '["http://localhost:3000"]'
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      GECKOTERMINAL_BASE_URL: https://api.geckoterminal.com/api/v2
      DEXSCREENER_BASE_URL: https://api.dexscreener.com
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  radar-postgres:
