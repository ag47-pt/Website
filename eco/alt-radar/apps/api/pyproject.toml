[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ag47-altcoin-radar-api"
version = "0.1.0"
description = "Read-only discovery, scoring and alerts API for AG47 Altcoin Radar."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.17,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.45,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
ag47-radar = "ag47_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ag47_radar"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "E501", "F841", "RUF059", "E402", "F821", "E711", "RUF012", "RUF006", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

