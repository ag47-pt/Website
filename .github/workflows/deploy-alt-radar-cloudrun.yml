name: Deploy Alt-Radar to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "eco/alt-radar/apps/api/**"
      - ".github/workflows/deploy-alt-radar-cloudrun.yml"
  workflow_dispatch:

env:
  PROJECT_ID: radar-altcoin
  REGION: europe-west3
  SERVICE_NAME: alt-radar-api

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        if: "${{ env.WIF_PROVIDER != '' }}"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Authenticate to Google Cloud (Service Account Key Fallback)
        if: "${{ env.WIF_PROVIDER == '' && secrets.GCP_SA_KEY != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source eco/alt-radar/apps/api \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars="AG47_ENVIRONMENT=production,AG47_DEMO_MODE=false,AG47_SCHEDULER_ENABLED=true,AG47_SCHEDULER_INTERVAL_SECONDS=300"
