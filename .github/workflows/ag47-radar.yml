name: AG47 Altcoin Radar CI

on:
  pull_request:
    paths:
      - "app/eco/alt-radar/**"
      - "app/api/eco/alt-radar/**"
      - "eco/alt-radar/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ag47-radar.yml"
      - ".github/workflows/deploy-alt-radar-cloudrun.yml"
  push:
    branches: [main]
    paths:
      - "app/eco/alt-radar/**"
      - "app/api/eco/alt-radar/**"
      - "eco/alt-radar/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ag47-radar.yml"
      - ".github/workflows/deploy-alt-radar-cloudrun.yml"

concurrency:
  group: alt-radar-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eco/alt-radar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            eco/alt-radar/package-lock.json
            eco/alt-radar/apps/web/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Install host integration dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: uv sync --project apps/api --extra dev --frozen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build the integrated public host
        run: npm run build
        working-directory: ${{ github.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key
