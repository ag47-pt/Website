<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>Planejar antes de escrever</title>
<rect width="1600" height="900" fill="#101218"/>
<text x="85" y="105" font-family="Arial" font-size="48" fill="#d1ff00">Planejar antes de escrever</text>
<text x="85" y="160" font-family="Arial" font-size="25" fill="#cbd5e1">Público e nível de consciência orientam cada decisão.</text>
<rect x="85" y="220" width="680" height="200" rx="20" fill="#1c2230" stroke="#546174"/>
<text x="115" y="268" font-family="Arial" font-size="30" fill="#d1ff00">1. Objetivo da conversa</text>
<text x="115" y="318" font-family="Arial" font-size="25" fill="#f1f5f9">Vender, agendar ou qualificar?</text>
<text x="115" y="356" font-family="Arial" font-size="25" fill="#f1f5f9">Defina a ação que encerra este percurso.</text>
<rect x="835" y="220" width="680" height="200" rx="20" fill="#1c2230" stroke="#546174"/>
<text x="865" y="268" font-family="Arial" font-size="30" fill="#d1ff00">2. Narrativa central</text>
<text x="865" y="318" font-family="Arial" font-size="25" fill="#f1f5f9">A big idea dá direção ao script.</text>
<text x="865" y="356" font-family="Arial" font-size="25" fill="#f1f5f9">Conecte a oferta ao desejo do público.</text>
<rect x="85" y="465" width="680" height="200" rx="20" fill="#1c2230" stroke="#546174"/>
<text x="115" y="513" font-family="Arial" font-size="30" fill="#d1ff00">3. Etapas necessárias</text>
<text x="115" y="563" font-family="Arial" font-size="25" fill="#f1f5f9">Escolha o que precisa ser explicado.</text>
<text x="115" y="601" font-family="Arial" font-size="25" fill="#f1f5f9">Adapte a profundidade ao contexto.</text>
<rect x="835" y="465" width="680" height="200" rx="20" fill="#1c2230" stroke="#546174"/>
<text x="865" y="513" font-family="Arial" font-size="30" fill="#d1ff00">4. Script e perguntas</text>
<text x="865" y="563" font-family="Arial" font-size="25" fill="#f1f5f9">Redija as mensagens com apoio da IA.</text>
<text x="865" y="601" font-family="Arial" font-size="25" fill="#f1f5f9">Revise a conversa e suas transições.</text>
<text x="85" y="790" font-family="Arial" font-size="24" fill="#cbd5e1">Referências: 21:07–41:00 • A quantidade de etapas depende do negócio.</text>
<text x="85" y="840" font-family="Arial" font-size="20" fill="#94a3b8">Síntese editorial • João Marcus / Aula 2 • Não é um frame do vídeo</text></svg>